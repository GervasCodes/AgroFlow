packages:
  - "apps/*"
  - "packages/*"
  - "channels/*"
  - "database"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@expo/cli@54.0.27'
  - expo-constants@18.0.14
  - expo-file-system@19.0.24
  - expo-modules-autolinking@3.0.27
  - expo@54.0.37
packageExtensions:
  react-router-dom@*:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  react-router@*:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true